[alembic]
# Path to migration scripts
script_location = alembic

# Optional: Needed for alembic>=1.10 if using multiple versions dirs
version_path_separator = os

# --- DATABASE URL (edit this for your MySQL setup) ---
sqlalchemy.url = mysql+pymysql://niloy:niloy940@localhost:3306/fastapi_ecommerce

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
